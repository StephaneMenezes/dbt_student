version: 2 

sources:
  - name: sales
    database: analytics
    schema: raw

    tables:
      - name: orders
        description: "This table contains all customer orders"
        columns:
          - name: order_id
            description: "The unique identifier for each order"
            tests: 
              - unique
              - not_null
          - name: customer_id
            description: "The unique identifier for each customer"
            tests:
              - not_null
          - name: order_date
            description: "The date when the order was placed"
          - name: total_amount
            description: "The total amount for the order"
          


      - name: order_items
        description: "This table contains all items within each order"
        columns:
          - name: order_item_id
            description: "The unique identifier for each order item"
          - name: order_id
            description: "The unique identifier for each order"
          - name: product_id
            description: "The unique identifier for each product"
          - name: quantity
            description: "The quantity of the product ordered"
          - name: price
            description: "The price of the product at the time of the order"

      - name: customers
        description: "This table contains all customer information"
        columns:
          - name: customer_id
            description: "The unique identifier for each customer"
          - name: first_name
            description: "The customer's first name"
          - name: last_name
            description: "The customer's last name"
          - name: email
            description: "The customer's email address"